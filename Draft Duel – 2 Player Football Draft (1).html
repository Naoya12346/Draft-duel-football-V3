<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#050a1a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Draft Duel – 2 Player Football Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:100%;margin:0;background-color:#020617;}
body{background:radial-gradient(circle at 50% 0%, #172554 0%, #020617 80%) fixed #020617;color:#fff;background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #020617 70%), linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 100% 100%, 30px 30px, 30px 30px;}
button{font:inherit;-webkit-tap-highlight-color:transparent;outline:none}
.gbtn{background:linear-gradient(180deg,#fef08a,#eab308);color:#000;font-style:italic;font-weight:800;box-shadow:0 4px 0 #854d0e,0 6px 15px rgba(234,179,8,0.4);border:1px solid #fef08a;text-shadow:0 1px 1px rgba(255,255,255,0.5);border-radius:16px;transition:all .1s}
.gbtn:active{transform:translateY(4px);box-shadow:0 0 0 #854d0e,0 2px 5px rgba(234,179,8,0.2)}
.gbtn:disabled{opacity:.5;filter:grayscale(1)}
.rb{background:linear-gradient(180deg, #0f172a, #1e293b 50%, #0f172a);border:2px solid #475569;border-radius:14px;box-shadow:inset 0 10px 20px rgba(0,0,0,0.8), inset 0 -10px 20px rgba(0,0,0,0.8);position:relative;overflow:hidden}
.rb::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, rgba(255,255,255,0.1), transparent 20%, transparent 80%, rgba(255,255,255,0.05));pointer-events:none}
.pitch{position:relative;height:420px;background:repeating-linear-gradient(#15803d 0 40px,#166534 40px 80px);border:4px solid #064e3b;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5)}
.pitch:before{content:"";position:absolute;left:0;right:0;top:46%;border-top:2px solid rgba(255,255,255,0.3)}
.pitch:after{content:"";position:absolute;left:50%;top:46%;width:110px;height:110px;margin:-55px;border:2px solid rgba(255,255,255,0.3);border-radius:50%}
*{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}html,body{overscroll-behavior:none;touch-action:manipulation}
#a>div{animation:fi .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tk{from{transform:translateY(-20px);opacity:.1}to{transform:none;opacity:1}}
.card-shadow{box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3)}
.glass-panel{background:rgba(15, 23, 42, 0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}
.bbtn{background:linear-gradient(180deg,#1e40af,#172554);color:#fff;font-style:italic;font-weight:800;border:1px solid #3b82f6;border-radius:14px;box-shadow:0 4px 0 #0b1437,0 6px 15px rgba(30,64,175,.5);transition:all .1s}
.bbtn:active{box-shadow:0 0 0 #0b1437;margin-top:4px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bob{animation:bob 2.6s ease-in-out infinite}

/* ===== premium home ===== */
.hx-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% -5%,#24479e 0%,#0b1538 42%,#03050f 100%)}
.hx-beam{position:absolute;top:-8%;width:150px;height:78vh;transform-origin:50% 0;transform:rotate(var(--r));background:linear-gradient(to bottom,var(--c),transparent 85%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(5px);animation:hxsway 7s ease-in-out infinite alternate}
.hx-beam:nth-child(2){animation-delay:-2s}.hx-beam:nth-child(3){animation-delay:-4s}
@keyframes hxsway{from{opacity:.55;transform:rotate(var(--r))}to{opacity:1;transform:rotate(calc(var(--r) + 5deg))}}
.hx-pitch{position:absolute;left:-30%;right:-30%;bottom:-6%;height:58%;transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;background:repeating-linear-gradient(90deg,#14532d 0 40px,#1a6b38 40px 80px);opacity:.55;-webkit-mask-image:linear-gradient(to top,#000 15%,transparent 92%);mask-image:linear-gradient(to top,#000 15%,transparent 92%)}
.hx-pitch:before{content:"";position:absolute;left:50%;top:18%;width:200px;height:200px;margin-left:-100px;border:3px solid rgba(255,255,255,.55);border-radius:50%}
.hx-pitch:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid rgba(255,255,255,.45)}
.hx-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.65) 100%)}
.hx-pt{position:absolute;bottom:-10px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #facc15;opacity:0;animation:hxup linear infinite}
@keyframes hxup{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-75vh);opacity:0}}
.hx-wrap{position:relative;z-index:1;padding:12px 14px 170px}
.hx-top{display:flex;align-items:center;gap:10px}
.hx-av{position:relative;width:54px;height:54px;border-radius:50%;padding:3px;box-shadow:0 0 16px rgba(249,115,22,.55)}
.hx-avin{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1e3a8a,#050b1f);display:flex;align-items:center;justify-content:center;border:2px solid #050b1f}
.hx-lv b{font-size:22px;font-weight:800;font-style:italic;line-height:1;display:block;text-shadow:0 2px 0 #000}
.hx-xp{display:flex;gap:3px;margin-top:5px}
.hx-xp i{display:block;width:26px;height:8px;transform:skewX(-22deg);background:#1e293b;border:1px solid #475569}
.hx-xp i.on{background:linear-gradient(180deg,#fde047,#f97316);border-color:#fde68a;box-shadow:0 0 8px rgba(250,204,21,.8)}
.hx-chip{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 10px;border-radius:12px;border:1px solid rgba(250,204,21,.4);background:linear-gradient(180deg,rgba(30,41,59,.85),rgba(2,6,23,.9));color:#facc15;box-shadow:0 0 12px rgba(250,204,21,.15)}
.hx-chip b{font-size:24px;font-weight:800;line-height:1;color:#fff}.hx-chip small{font-size:11px;letter-spacing:.18em;font-weight:800;color:#94a3b8}
.hx-logo{text-align:center;margin-top:14px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(250,204,21,.35))}
.hx-tag{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.38em;color:#93c5fd;filter:none}
.hx-tag i{display:block;width:34px;height:2px;background:linear-gradient(90deg,transparent,#60a5fa)}.hx-tag i:last-child{transform:scaleX(-1)}
.hx-t{font-size:60px;font-weight:800;font-style:italic;line-height:.95;letter-spacing:-.02em;margin-top:2px}
.hx-t span{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hx-t .s{background-image:linear-gradient(180deg,#fff 25%,#9fb6e6)}
.hx-t .g{margin-left:10px;background-image:linear-gradient(110deg,#c98a0c 0%,#ffe27a 38%,#fff 50%,#ffe27a 62%,#c98a0c 100%);background-size:260% 100%;animation:hxs 3.6s linear infinite}
@keyframes hxs{from{background-position:130% 0}to{background-position:-130% 0}}
.hx-hero{position:relative;display:flex;justify-content:center;align-items:center;margin-top:16px;height:222px}
.hx-card{position:relative;width:146px;height:194px;flex:none;filter:drop-shadow(0 12px 16px rgba(0,0,0,.65)) drop-shadow(0 0 14px var(--c2))}
.hx-a{margin-right:-8px;transform:rotate(-6deg);animation:hxf1 4.5s ease-in-out infinite}
.hx-b{margin-left:-8px;transform:rotate(6deg);animation:hxf2 4.5s ease-in-out infinite}
@keyframes hxf1{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-7px)}}
@keyframes hxf2{0%,100%{transform:rotate(6deg) translateY(-7px)}50%{transform:rotate(6deg) translateY(0)}}
.hx-cin{position:absolute;inset:0;overflow:hidden;color:var(--tx);clip-path:polygon(50% 0,100% 7%,100% 84%,50% 100%,0 84%,0 7%);background:linear-gradient(155deg,var(--c1),var(--c2) 46%,var(--c3))}
.hx-cin:before{content:"";position:absolute;inset:3px;clip-path:polygon(50% 0,100% 7%,100% 84%,50% 100%,0 84%,0 7%);background:repeating-linear-gradient(60deg,rgba(255,255,255,.13) 0 6px,transparent 6px 15px),radial-gradient(circle at 50% 28%,rgba(255,255,255,.4),transparent 62%);border:0}
.hx-cin:after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:hxsh 4.2s ease-in-out infinite}
@keyframes hxsh{0%,55%{left:-70%}100%{left:130%}}
.hx-rt{position:absolute;top:24px;left:20px;line-height:.9;z-index:2}
.hx-rt b{display:block;font-size:34px;font-weight:800;font-style:italic}.hx-rt small{font-size:10px;font-weight:800;letter-spacing:.2em}
.hx-sil{position:absolute;left:50%;top:32px;width:90px;margin-left:-36px;fill:rgba(0,0,0,.26);z-index:1}
.hx-inp{position:absolute;z-index:3;left:16px;right:16px;bottom:32px;width:auto;padding:3px 4px;border:0;border-bottom:2px solid rgba(0,0,0,.5);border-radius:6px;background:rgba(0,0,0,.16);text-align:center;font:800 italic 20px 'Barlow Condensed',Arial,sans-serif;color:var(--tx);outline:none;text-transform:uppercase}
.hx-inp::placeholder{color:rgba(0,0,0,.38)}.hx-inp:focus{background:rgba(255,255,255,.35)}
.hx-fm{position:absolute;z-index:2;left:0;right:0;bottom:13px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.15em;opacity:.75}
.hx-vs{position:absolute;z-index:6;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;font-style:italic;color:#fff;border:2px solid #ffd27a;background:radial-gradient(circle at 35% 30%,#ff9a62,#e2231a 60%,#7a0f0f);box-shadow:0 0 18px rgba(255,80,40,.8),0 4px 8px rgba(0,0,0,.6);text-shadow:0 2px 0 rgba(0,0,0,.5);animation:hxv 1.8s ease-in-out infinite}
@keyframes hxv{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.hx-modes{display:flex;gap:8px;margin-top:18px}
.hx-tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:14px;border:1.5px solid rgba(148,163,184,.25);background:linear-gradient(180deg,rgba(30,41,59,.75),rgba(8,14,32,.85));color:#94a3b8;backdrop-filter:blur(6px);transition:all .15s}
.hx-tile b{font-size:14px;font-weight:800;font-style:italic;letter-spacing:.04em;line-height:1}.hx-tile small{font-size:12px;font-weight:700;opacity:.8;line-height:1}
.hx-tile.on{border-color:#facc15;color:#facc15;transform:translateY(-3px);background:linear-gradient(180deg,rgba(250,204,21,.24),rgba(120,80,0,.3));box-shadow:0 0 18px rgba(250,204,21,.4),inset 0 0 12px rgba(250,204,21,.15)}
.hx-tile:active{transform:scale(.95)}
.hx-desc{text-align:center;margin-top:10px;font-size:14px;font-weight:700;letter-spacing:.12em;color:#94a3b8}
.hx-dock{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:500px;margin:0 auto;padding:34px 12px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to top,rgba(2,6,23,.96) 55%,transparent)}
.hx-row{display:flex;align-items:flex-end;gap:10px}
.hx-sd{flex:.8;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(59,130,246,.4))}
.hx-pw{flex:1.7;animation:hxp 2.2s ease-in-out infinite}
@keyframes hxp{0%,100%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(250,204,21,.4))}50%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(250,204,21,.9))}}
.hx-side,.hx-play{display:block;width:100%;border:0;padding:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.hx-side{background:linear-gradient(180deg,#bfdbfe,#2563eb)}.hx-play{background:linear-gradient(180deg,#fffbd0,#f5b800)}
.hx-side span,.hx-play span{position:relative;overflow:hidden;display:flex;margin:2px;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);align-items:center;justify-content:center;transition:transform .08s}
.hx-side span{flex-direction:column;gap:2px;height:60px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%),linear-gradient(180deg,#1d4ed8,#0f1f58)}
.hx-side b{font-size:15px;font-weight:800;font-style:italic;letter-spacing:.05em;line-height:1}
.hx-play span{height:74px;color:#111;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 48%),linear-gradient(180deg,#ffe45c,#f5a300)}
.hx-play b{font-size:46px;font-weight:800;font-style:italic;letter-spacing:.06em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.hx-play span:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:hxsh 3s ease-in-out infinite}
.hx-side:active span,.hx-play:active span{transform:translateY(3px);filter:brightness(.92)}

#a{position:relative;z-index:1}
html{-webkit-text-size-adjust:100%}body{-webkit-touch-callout:none}
button:not(.gbtn):not(.hx-side):not(.hx-play):not(.rsb):not(.abt):active{transform:scale(.94)}
.gbtn{position:relative;overflow:hidden}
.gbtn:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:hxsh 3s ease-in-out infinite;pointer-events:none}
.hx-snd{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(148,163,184,.4);background:rgba(15,23,42,.8);color:#cbd5e1}
.hx-side em{font-style:normal;font-size:10px;letter-spacing:.12em;color:#93c5fd;font-weight:700;line-height:1}
.hx-nm{position:absolute;z-index:3;left:12px;right:12px;bottom:30px;text-align:center;font:800 italic 21px/1 'Barlow Condensed',Arial,sans-serif;color:var(--tx);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-fg{position:absolute;top:26px;right:22px;z-index:2;font-size:22px;line-height:1}
.rsw{filter:drop-shadow(0 5px 8px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(168,85,247,.45))}
.rsb{display:block;border:0;padding:0;background:linear-gradient(180deg,#e9d5ff,#7c3aed);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.rsb span{display:flex;align-items:center;gap:8px;height:46px;padding:0 26px;margin:2px;color:#fff;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 50%),linear-gradient(180deg,#6d28d9,#2e1065);transition:transform .08s}
.rsb b{font-size:20px;font-weight:800;font-style:italic;letter-spacing:.08em}
.rsb i{font-style:normal;font-weight:800;font-size:15px;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#facc15;color:#000;box-shadow:0 0 8px rgba(250,204,21,.7)}
.rsb:active span{transform:translateY(2px)}
.rsb:disabled{filter:grayscale(1) brightness(.7);opacity:.6}.rsb:disabled i{background:#64748b;box-shadow:none;color:#cbd5e1}
.abt{border:1.5px solid #60a5fa;background:linear-gradient(180deg,#2563eb,#0f1f58);color:#fff;border-radius:12px;font-weight:800;font-style:italic;box-shadow:0 4px 0 #0b1437;transition:all .08s}
.abt:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1437}.abt:disabled{opacity:.3;filter:grayscale(.6)}
.abt.red{border-color:#fca5a5;background:linear-gradient(180deg,#ef4444,#7f1d1d);box-shadow:0 4px 0 #450a0a}
.soldstamp{display:inline-block;font-size:84px;line-height:1;font-weight:800;font-style:italic;border:6px solid currentColor;padding:4px 22px;border-radius:10px;letter-spacing:.04em;text-shadow:0 0 20px currentColor;transform:rotate(-8deg);animation:stamp .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

/* ===== auction pro UI ===== */
.bbw{filter:drop-shadow(0 5px 6px rgba(0,0,0,.55)) drop-shadow(0 0 7px var(--k))}
.bbw.off{filter:grayscale(1);opacity:.35}
.bb{display:block;width:100%;border:0;padding:0;background:var(--k);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.bb span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;margin:2px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 55%),linear-gradient(180deg,#16286a,#0a1233);transition:transform .08s}
.bb b{font-size:22px;font-weight:800;font-style:italic;line-height:1;color:#fff}
.bb em{font-style:normal;font-size:15px;font-weight:800;line-height:1;color:var(--k)}
.bb:active span{transform:translateY(2px);filter:brightness(1.25)}
.pbw{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.pbt{display:block;width:100%;border:0;padding:0;background:linear-gradient(180deg,#fca5a5,#b91c1c);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.pbt span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;margin:2px;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%),linear-gradient(180deg,#5b1212,#2a0808)}
.pbt b{font-size:26px;font-weight:800;font-style:italic;letter-spacing:.12em;line-height:1;color:#fecaca}
.pbt em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.06em;line-height:1;color:#fca5a5;opacity:.85}
.pbt:active span{transform:translateY(2px)}
.hchip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid;border-radius:8px;padding:1px 8px;font-size:15px;font-weight:800;line-height:22px;background:rgba(2,6,23,.6);white-space:nowrap}
.hchip b{color:#fff}
.tierchip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.2em;padding:1px 9px;border-radius:6px;border:1.5px solid;margin-bottom:4px}
.hx-face{position:absolute;z-index:1;left:50%;top:30px;width:96px;height:106px;margin-left:-48px;object-fit:cover;object-position:50% 14%;border-radius:48px 48px 0 0;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(#000 60%,transparent 100%);mask-image:linear-gradient(#000 60%,transparent 100%);filter:contrast(1.05) saturate(1.05)}
.hx-card.icn{filter:drop-shadow(0 12px 16px rgba(0,0,0,.65)) drop-shadow(0 0 22px #a855f7)}
.hx-cam{position:absolute;z-index:4;left:20px;top:86px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.hx-av2{width:108px;top:24px;margin-left:-54px;fill:none;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.hx-nm2{position:absolute;z-index:3;left:12px;right:12px;bottom:72px;text-align:center;font:800 italic 23px/1 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;color:var(--tx);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lcs{position:absolute;z-index:3;left:14px;right:14px;bottom:34px;display:flex;justify-content:space-between;border-top:1.5px solid rgba(0,0,0,.25);padding-top:5px;color:var(--tx)}
.lcs span{text-align:center;line-height:1}.lcs small{display:block;font-size:9px;font-weight:800;letter-spacing:.06em;opacity:.7}.lcs b{font-size:17px;font-weight:800}
.bbw{filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}

/* ===== ULTRA MOTION & HOVER FX ===== */
:root{--ease:cubic-bezier(.22,.68,.2,1)}
html,body{background:#020617}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;overflow:hidden}
button::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 62%);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
button:focus-visible{outline:2px solid #facc15;outline-offset:2px}
#a>div{animation:screenIn .48s var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes cardUp{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes chipIn{from{opacity:0;transform:translateY(-9px) scale(.82)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.88)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes softGlow{0%,100%{box-shadow:0 0 10px rgba(250,204,21,.25)}50%{box-shadow:0 0 26px rgba(250,204,21,.65)}}
@keyframes rippleFx{from{transform:scale(0);opacity:.85}to{transform:scale(1);opacity:0}}
@keyframes sparkFx{from{transform:translate(-50%,-50%) rotate(var(--a)) translateX(0) scale(1);opacity:1}to{transform:translate(-50%,-50%) rotate(var(--a)) translateX(var(--d)) scale(.2);opacity:0}}
@keyframes orbFx{0%{transform:translate(0,0) scale(1)}50%{transform:translate(28px,-38px) scale(1.15)}100%{transform:translate(-18px,22px) scale(.95)}}
.hx-pw{animation:hxp 4.2s ease-in-out infinite}
.hx-a{animation-duration:7s}.hx-b{animation-duration:7s}
.hx-cin:after{animation-duration:7s}
.hx-t .g{animation-duration:6s}
.bob{animation-duration:4s}
.hx-card:not(.hx-a):not(.hx-b){transform:translateZ(0);backface-visibility:hidden}
.hx-card,.hx-cin{-webkit-font-smoothing:antialiased}
.tilt{transition:transform .18s var(--ease),filter .18s var(--ease)}
.orb{position:absolute;border-radius:50%;filter:blur(65px);opacity:.4;animation:orbFx 16s ease-in-out infinite alternate}
.orb.a{width:230px;height:230px;left:-4%;top:12%;background:#1d4ed8}.orb.b{width:190px;height:190px;right:-3%;top:38%;background:#a855f7;animation-delay:-7s}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 68%);animation:rippleFx .55s var(--ease) forwards}
.spark{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:99;box-shadow:0 0 8px currentColor;animation:sparkFx .7s var(--ease) forwards}
.bidhist{height:32px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;scrollbar-width:none;-ms-overflow-style:none}
.bidhist::-webkit-scrollbar{display:none}
.bidhist>.hchip,.bidhist>.hsep{flex:0 0 auto}
.bidhist>.hchip,.hchip{animation:chipIn .3s var(--ease) both}
.bidpop,.pop{animation:popIn .34s var(--ease)}
.toast{animation:toastIn .28s var(--ease)}
.soldstamp{animation:stamp .7s var(--ease)}
.bbw{animation:cardUp .42s var(--ease) backwards}
.bbw:nth-child(2){animation-delay:.05s}.bbw:nth-child(3){animation-delay:.1s}.bbw:nth-child(4){animation-delay:.15s}
.pbw{animation:cardUp .45s .18s var(--ease) backwards}
.hx-tile{animation:cardUp .4s var(--ease) backwards}
.hx-tile:nth-child(2){animation-delay:.06s}.hx-tile:nth-child(3){animation-delay:.12s}.hx-tile:nth-child(4){animation-delay:.18s}
.teamrow{animation:cardUp .4s var(--ease) backwards;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.pitch{transition:box-shadow .4s var(--ease)}
.glow{animation:softGlow 2.4s ease-in-out infinite}
@media (hover:hover) and (pointer:fine){
 button:not(:disabled):hover::before{opacity:1}
 button:not(:disabled){transition:filter .18s var(--ease),transform .18s var(--ease),box-shadow .18s var(--ease)}
 button:not(:disabled):hover{filter:brightness(1.12)}
 .gbtn:not(:disabled):hover{transform:translateY(-3px) scale(1.03);box-shadow:0 7px 0 #854d0e,0 12px 30px rgba(234,179,8,.6)}
 .bbtn:not(:disabled):hover,.abt:not(:disabled):hover,.hx-side:hover,.hx-play:hover{transform:translateY(-3px);filter:brightness(1.14)}
 .bbw:hover{transform:translateY(-6px) scale(1.03);filter:drop-shadow(0 10px 10px rgba(0,0,0,.65)) drop-shadow(0 0 16px var(--k))}
 .bbw:hover .bb span{transform:translateY(-3px);filter:brightness(1.24)}
 .pbw:hover{transform:translateY(-3px)}
 .pbw:hover .pbt span{transform:translateY(-3px);filter:brightness(1.22)}
 .rsb:not(:disabled):hover span{transform:translateY(-3px);filter:brightness(1.2)}
 .hx-side:hover span,.hx-play:hover span{transform:translateY(-4px);filter:brightness(1.16)}
 .hx-tile:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(250,204,21,.8);box-shadow:0 0 22px rgba(250,204,21,.3)}
 .hx-tile.on{animation:softGlow 2.6s ease-in-out infinite}
 .hx-card:hover{filter:brightness(1.12)}
 .hx-snd:hover{background:#1e293b;color:#fff;box-shadow:0 0 16px rgba(250,204,21,.4)}
 .teamrow:hover{transform:translateX(5px);border-color:#60a5fa;box-shadow:0 8px 20px rgba(37,99,235,.2)}
 #lst button:not(:disabled):hover{transform:translateY(-3px);border-color:#3b82f6;box-shadow:0 10px 22px rgba(0,0,0,.5)}
}


/* ===== v2: smooth, native-feel, responsive ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1)}
@keyframes screenIn{from{opacity:0;transform:translate3d(0,18px,0) scale(.985)}to{opacity:1;transform:none}}
#a>div{animation:screenIn .42s var(--out) backwards}
#a>div.ns{animation:none}
#a>div.ns .bbw,#a>div.ns .pbw,#a>div.ns .hx-tile,#a>div.ns .teamrow,#a>div.ns .hchip,#a>div.ns .pop{animation:none}
#a>div.ns .hchip:last-child{animation:chipIn .35s var(--spring)}
@keyframes popIn{from{opacity:0;transform:scale(.7)}60%{transform:scale(1.08)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}}
#sh{animation:sheetUp .55s var(--out) backwards}
#lst{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button,.gbtn,.bbtn,.abt{transition:transform .38s var(--spring),box-shadow .2s,filter .2s,opacity .2s,background-color .2s,border-color .2s,color .2s}
button:not(:disabled):active{transform:scale(.94);transition-duration:.07s}
.gbtn:not(:disabled):active{transform:translateY(3px) scale(.96)}
@keyframes hxsh{0%,55%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(600%) skewX(-20deg)}}
.hx-pw{animation:none!important;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(250,204,21,.7))}
.hx-t{font-size:clamp(44px,15.5vw,64px)}
.pitch{height:clamp(420px,56dvh,520px)}
.min-h-screen{min-height:100dvh!important}
.min-h-\[85vh\]{min-height:85dvh!important}
@media (max-width:360px){.hx-play b{font-size:38px}.hx-side b{font-size:13px}.bb b{font-size:19px}.bb em{font-size:13px}.hx-chip b{font-size:20px}}
/* ===== perf: lag + vibration fix ===== */
.glass-panel,.hx-tile{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.glass-panel{background:rgba(15,23,42,.94)}
.orb,.hx-pt,.ripple,.spark{display:none!important}
.hx-beam{animation:none!important;filter:none!important;opacity:.7}
.hx-cin:after,.gbtn:after,.hx-play span:after,button::before{display:none!important}
.hx-t .g{animation:none!important;background-position:50% 0}
.hx-vs,.glow{animation:none!important}
@keyframes screenIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
#a>div{animation:screenIn .3s var(--out) backwards}
.hx-a,.hx-b{will-change:transform}
.rc{width:146px;margin:0 auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6)) drop-shadow(0 0 12px var(--g))}

.rc-ov{position:absolute;text-align:center;font:800 italic 34px/.9 'Barlow Condensed',Arial,sans-serif}
.rc-ov small{display:block;font-size:13px;letter-spacing:.1em}
.rc-k .rc-ov{left:21%;top:17%;color:#4a2300;text-shadow:0 1px 0 rgba(255,236,160,.9)}
.rc-h .rc-ov{left:16%;top:15%;color:#ffe9a8;text-shadow:0 2px 3px rgba(0,0,0,.65)}
.rc-in{margin-top:-6px;padding:3px 5px 4px;border-radius:2px 2px 12px 12px;background:linear-gradient(180deg,#2e0f0f,#12060a);border:1px solid var(--g)}
.rc-n{font:800 italic 17px/1.15 'Barlow Condensed',Arial,sans-serif;color:#fff;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.rc-s{display:flex;justify-content:space-between;font:800 14px/1 'Barlow Condensed',Arial,sans-serif;color:var(--g);text-align:center}
.rc-s small{display:block;font-size:7px;color:#94a3b8;letter-spacing:.04em}
.rc{container-type:inline-size;width:100%}
.rc-art{height:auto}
.rc-k .rc-art{aspect-ratio:340/351}
.rc-h .rc-art{aspect-ratio:256/290}
.rc-ov{font-size:23cqw}.rc-ov small{font-size:8.5cqw}
.rc-t{position:absolute;left:19%;right:19%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Barlow Condensed',Arial,sans-serif;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.rc-k .rc-t{top:63%;bottom:9%}
.rc-h .rc-t{top:62%;bottom:13%;left:15%;right:15%}
.rc-nm{max-width:100%;font-weight:800;font-style:italic;line-height:1.05;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-sb{font-size:5.6cqw;font-weight:700;letter-spacing:.03em;line-height:1.1;color:var(--g);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rc-s2{display:flex;justify-content:space-between;width:100%;margin-top:1.5cqw;font-weight:800;font-size:8cqw;line-height:1;color:#fff}
.rc-s2 span{text-align:center}.rc-s2 small{display:block;font-size:4cqw;color:var(--g);letter-spacing:.04em}
.fb{display:inline-flex;align-items:center;justify-content:center;position:relative;width:1.2em;height:1.2em;border-radius:50%;overflow:hidden;vertical-align:-.2em;line-height:1;background:#1e293b;border:.07em solid rgba(255,255,255,.85);box-shadow:0 .06em .2em rgba(0,0,0,.55),inset 0 0 .25em rgba(0,0,0,.35)}
.fb>span{font-size:1.55em;line-height:1}
.fb:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.42),transparent 45%,rgba(0,0,0,.28))}
.cr{width:.95em;height:1.1em;vertical-align:-.2em;filter:drop-shadow(0 .05em .1em rgba(0,0,0,.6))}
.rc{position:relative;isolation:isolate}
.rc:before{content:"";position:absolute;inset:10%;border-radius:50%;background:var(--g);filter:blur(22px);opacity:.3;z-index:-1;animation:rcPulse 2.8s ease-in-out infinite}
@keyframes rcPulse{50%{opacity:.6;transform:scale(1.12)}}
.rc-fg{position:absolute;right:15%;top:14%;font-size:15cqw}
.rc-fg .fb,.rc-fg .cr{border-color:var(--g);box-shadow:0 0 0 .05em var(--g),0 .08em .3em rgba(0,0,0,.7)}
@keyframes cardFlip{from{opacity:0;transform:perspective(600px) rotateY(-80deg) scale(.7)}to{opacity:1;transform:none}}
.rc,.hx-card.tilt{animation:cardFlip .65s var(--spring) backwards}
.rc-ov{animation:popIn .5s .3s var(--spring) backwards}
#a>div.ns .rc,#a>div.ns .hx-card.tilt,#a>div.ns .rc-ov{animation:none}
#a>div.ns .rc:before{animation:rcPulse 2.8s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.035)}}
.hx-pw{animation:breath 2.6s ease-in-out infinite!important}
.fw{width:1.5em;height:1em;border-radius:.16em;vertical-align:-.14em;box-shadow:0 0 0 .05em rgba(255,255,255,.85),0 .1em .3em rgba(0,0,0,.6)}
.rc-fg .fw{box-shadow:0 0 0 .06em var(--g),0 .08em .3em rgba(0,0,0,.7)}
.simln{padding:6px 10px;margin-bottom:6px;border-left:3px solid;border-radius:8px;background:rgba(15,23,42,.92);font-size:19px;font-weight:700;color:#e2e8f0;animation:cardUp .3s var(--out)}
/* ===== v5 motion on every screen ===== */
.orb,.hx-pt,.ripple{display:block!important}
.orb{filter:none!important;opacity:.9}
.orb.a{background:radial-gradient(circle,rgba(29,78,216,.5),transparent 68%)}
.orb.b{background:radial-gradient(circle,rgba(168,85,247,.42),transparent 68%)}
.hx-beam{animation:hxsway 7s ease-in-out infinite alternate!important}
.hx-cin:after,.gbtn:after,.hx-play span:after{display:block!important}
.hx-t .g{animation:hxs 6s linear infinite!important}
@keyframes heroL{from{opacity:0;transform:translateX(-70px) rotate(-22deg) scale(.7)}to{opacity:1;transform:rotate(-6deg)}}
@keyframes heroR{from{opacity:0;transform:translateX(70px) rotate(22deg) scale(.7)}to{opacity:1;transform:rotate(6deg)}}
@keyframes vsIn{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:none}}
@keyframes dockUp{from{opacity:0;transform:translateY(60px)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-30px) scale(.9)}}
.hx-a{animation:heroL .9s .15s var(--spring) backwards,hxf1 7s ease-in-out 1s infinite}
.hx-b{animation:heroR .9s .25s var(--spring) backwards,hxf2 7s ease-in-out 1.1s infinite}
.hx-vs{animation:vsIn .7s .7s var(--spring) backwards,hxv 1.8s ease-in-out 1.4s infinite!important}
.hx-dock{animation:dockUp .6s .35s var(--out) backwards}
.hx-logo{animation:dropIn .7s .05s var(--spring) backwards}
.hx-top{animation:cardUp .5s var(--out) backwards}
#a>div:not(.ns) .rounded-2xl,#a>div:not(.ns) .rounded-3xl{animation:cardUp .5s var(--spring) backwards}
#a>div:not(.ns) .rounded-2xl:nth-child(2){animation-delay:.05s}#a>div:not(.ns) .rounded-2xl:nth-child(3){animation-delay:.1s}#a>div:not(.ns) .rounded-2xl:nth-child(4){animation-delay:.15s}#a>div:not(.ns) .rounded-2xl:nth-child(5){animation-delay:.2s}#a>div:not(.ns) .rounded-2xl:nth-child(6){animation-delay:.25s}#a>div:not(.ns) .rounded-2xl:nth-child(7){animation-delay:.3s}#a>div:not(.ns) .rounded-2xl:nth-child(8){animation-delay:.35s}
#a>div.ns [class*="border-yellow-400"]{animation:popIn .35s var(--spring)}
#lst[data-s]>button{animation:cardUp .4s var(--out) backwards}
#lst[data-s]>button:nth-child(2){animation-delay:.04s}#lst[data-s]>button:nth-child(3){animation-delay:.08s}#lst[data-s]>button:nth-child(4){animation-delay:.12s}#lst[data-s]>button:nth-child(5){animation-delay:.16s}#lst[data-s]>button:nth-child(6){animation-delay:.2s}
.gbtn[onclick="spin(0)"]:not(:active):not(:disabled){animation:breath 1.8s ease-in-out infinite}

['CB','LB','RB'].forEach(k=>AC[k].push('DF'));['DM','CM','AM','LM','RM'].forEach(k=>AC[k].push('MF'));['LW','RW','ST'].forEach(k=>AC[k].push('FW'));
OF.DF=OF.CB;OF.MF=OF.CM;OF.FW=OF.ST;GR.DEF.push('DF');GR.MID.push('MF');GR.FWD.push('FW');
const addSq=a=>(Array.isArray(a)?a:[]).forEach(q=>{try{
 const c=String(q.c||'').toLowerCase().slice(0,2),n=String(q.n||''),y=String(q.y||'');if(!c||!n||!y||!Array.isArray(q.pl))return;
 const pl=q.pl.map(x=>Array.isArray(x)?{n:x[0],p:x[1],o:x[2]}:x).map(x=>({n:String(x.n||'').trim(),p:String(x.p||'').toUpperCase(),o:Math.max(1,Math.min(99,+x.o||60))})).filter(x=>x.n&&(AC[x.p]||['DF','MF','FW'].includes(x.p))).map(x=>({...x,id:x.n+c+y,c,y}));
 if(pl.length<5)return;const sq={c,n,y,pl},i=DB.findIndex(d=>d.c==c&&d.n==n&&d.y==y);i>=0?DB[i]=sq:DB.push(sq)}catch(e){}});
fetch('players.json').then(r=>r.json()).then(addSq).catch(()=>{});

AC.LW.push('ST','AM');AC.RW.push('ST','AM');AC.LM.push('ST');AC.RM.push('ST');AC.ST.push('AM');AC.AM.push('LW','RW','ST','LM','RM');AC.CM.push('LM','RM');
let CL=[],PO={},XP=[],AL=[];
try{CL=JSON.parse(localStorage.getItem('dd_lots')||'[]')}catch(e){}try{PO=JSON.parse(localStorage.getItem('dd_po')||'{}')}catch(e){}try{XP=JSON.parse(localStorage.getItem('dd_xp')||'[]')}catch(e){}
const svA=()=>{try{localStorage.setItem('dd_lots',JSON.stringify(CL));localStorage.setItem('dd_po',JSON.stringify(PO));localStorage.setItem('dd_xp',JSON.stringify(XP))}catch(e){toast('Storage full ho gaya')}};
const LT=()=>[{id:'mythic',name:'MYTHIC',col:'#fbbf24',k:1},{id:'legend',name:'LEGEND',col:'#f87171',h:1},...CL];
function lotOf(x){const o=PO[x.id];if(o=='none')return null;const L=LT();if(o){const l=L.find(q=>q.id==o);if(l)return l}return x.o>=96?L[0]:x.o>=93?L[1]:null}
const tierX=x=>{const l=lotOf(x);return l?[l.name,l.col]:tierN(x.o>=93?92:x.o)};
function lotCSS(){let e=$('cst');if(!e){e=document.createElement('style');e.id='cst';document.head.appendChild(e)}e.textContent=CL.map(l=>`.rc-c${l.id} .rc-art{background-image:url(${l.img});aspect-ratio:${l.w}/${l.h}}`).join('')}
function applyXP(a){a.forEach(e=>{let q=DB.find(d=>d.c==e.c&&d.n==e.n&&String(d.y)==String(e.y));if(!q){q={c:e.c,n:e.n,y:String(e.y),pl:[]};DB.push(q)}const p=e.p;if(!q.pl.some(x=>x.n==p.n))q.pl.push({n:p.n,p:p.p,o:+p.o,id:p.n+e.c+e.y,c:e.c,y:String(e.y)})})}
applyXP(XP);lotCSS();
function admin(){scrollTo(0,0);
 const inp='rounded-lg bg-slate-800 border border-slate-600 px-2 py-1 text-lg font-bold min-w-0';
 app(`<div class="px-4 pt-8 pb-10"><div class="flex items-center justify-between mb-4"><div class="w-10"></div><div class="text-3xl font-extrabold italic">ADMIN PANEL</div><button class="w-10 h-10 rounded-xl border border-slate-600 bg-slate-800/50 flex items-center justify-center" onclick="settings()">${ic('Q',20)}</button></div>
 <div class="rounded-2xl glass-panel p-4 mb-3"><div class="text-2xl font-black italic">CARD LOTS</div><div class="text-base text-slate-400 font-semibold mb-2">Card PNG add karo. File ka naam = player ka naam, to wo player us card me apne aap lag jata hai.</div><div id="alots"></div><button class="gbtn w-full py-3 text-2xl mt-2" onclick="addCards()">+ ADD CARD PNG</button></div>
 <div class="rounded-2xl glass-panel p-4 mb-3"><div class="text-2xl font-black italic mb-2">ADD NEW PLAYER</div><div class="grid grid-cols-2 gap-2"><input id="pn" class="${inp} col-span-2" placeholder="Player name"><select id="pp" class="${inp}">${['ST','LW','RW','AM','CM','DM','LM','RM','LB','CB','RB','GK'].map(q=>`<option>${q}</option>`).join('')}</select><input id="po" type="number" class="${inp}" placeholder="OVR (40-99)"><select id="pc" class="${inp}">${Object.keys(FLG).map(q=>`<option>${q}</option>`).join('')}</select><input id="py" type="number" class="${inp}" placeholder="Year"><input id="pt" class="${inp} col-span-2" placeholder="Team name (e.g. Brazil)"></div><button class="bbtn w-full py-2 text-xl mt-3" onclick="addP()">ADD PLAYER</button></div>

 <button class="abt red w-full py-2 text-xl" onclick="adReset()">RESET ADMIN DATA</button></div>`);aLots();aList()}
function aLots(){const L=LT(),cnt=id=>{let n=0;DB.forEach(q=>q.pl.forEach(x=>{const l=lotOf(x);if(l&&l.id==id)n++}));return n};
 $('alots').innerHTML=L.map((l,i)=>{const c=i>1,j=i-2;return `<div class="rounded-xl bg-slate-900/70 border border-slate-700 p-3 mb-2"><div class="flex items-center gap-2"><i class="w-4 h-4 rounded-full shrink-0" style="background:${l.col}"></i>${c?`<input class="min-w-0 flex-1 rounded-lg bg-slate-800 border border-slate-600 px-2 py-1 text-xl font-black" value="${ev(l.name)}" oninput="CL[${j}].name=this.value.toUpperCase();svA()">`:`<b class="flex-1 text-xl font-black">${l.name} LOT</b>`}<span class="text-sm font-bold text-slate-400 shrink-0">${cnt(l.id)} players</span>${c?`<button class="abt red px-3 py-1" onclick="delLot(${j})">${ic('Q',16)}</button>`:''}</div>${c?`<div class="flex items-center gap-3 mt-2 text-sm font-bold text-slate-400"><label>Glow <input type="color" value="${l.col}" oninput="CL[${j}].col=this.value;svA()"></label><label>Text <input type="color" value="${l.tc}" oninput="CL[${j}].tc=this.value;svA()"></label><label>Text pos <input type="number" min="30" max="90" value="${l.ty}" class="w-14 rounded bg-slate-800 border border-slate-600 px-1" oninput="CL[${j}].ty=+this.value||66;svA()"></label></div>`:''}</div>`}).join('')}
function aList(){const q=norm($('aq').value||'').trim(),L=LT();
 AL=DB.flatMap(s=>s.pl.map(x=>({...x,tn:s.n}))).filter(x=>!q||norm(x.n+' '+x.tn+' '+x.y).includes(q)).sort((a,b)=>b.o-a.o).slice(0,40);

function setPO(i,v){const x=AL[i];if(!x)return;v=='auto'?delete PO[x.id]:PO[x.id]=v;svA();toast('Saved ✓')}

function addP(){const v=id=>$(id).value.trim(),n=v('pn');if(!n)return toast('Player ka naam likho');const e={c:v('pc'),n:v('pt')||'Custom XI',y:v('py')||'2024',p:{n,p:v('pp'),o:Math.max(40,Math.min(99,+v('po')||80))}};XP.push(e);applyXP([e]);svA();aLots();aList();$('pn').value='';toast(n+' add ho gaya ✓')}

function addCards(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;
 i.onchange=async()=>{let n=0;for(const f of i.files){try{const d=await new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const W=Math.min(420,im.width),c=document.createElement('canvas');c.width=W;c.height=Math.round(im.height*W/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res([c.toDataURL('image/webp',.85),c.width,c.height])};im.onerror=rej;im.src=u});
  const nm=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim(),id='c'+Date.now().toString(36)+Math.floor(Math.random()*99),key=norm(nm).replace(/[^a-z]/g,'');
  CL.push({id,name:nm.toUpperCase().slice(0,14),img:d[0],w:d[1],h:d[2],col:'#38bdf8',tc:'#ffffff',ty:66});
