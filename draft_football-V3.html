<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#050a1a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>Draft Duel – 2 Player Football Draft</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;min-height:100%;margin:0;background-color:#020617;}
body{background:radial-gradient(circle at 50% 0%, #172554 0%, #020617 80%) fixed #020617;color:#fff;background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, #020617 70%), linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 100% 100%, 30px 30px, 30px 30px;}
button{font:inherit;-webkit-tap-highlight-color:transparent;outline:none}
.gbtn{background:linear-gradient(180deg,#fef08a,#eab308);color:#000;font-style:italic;font-weight:800;box-shadow:0 4px 0 #854d0e,0 6px 15px rgba(234,179,8,0.4);border:1px solid #fef08a;text-shadow:0 1px 1px rgba(255,255,255,0.5);border-radius:16px;transition:all .1s}
.gbtn:active{transform:translateY(4px);box-shadow:0 0 0 #854d0e,0 2px 5px rgba(234,179,8,0.2)}
.gbtn:disabled{opacity:.5;filter:grayscale(1)}
.rb{background:linear-gradient(180deg, #0f172a, #1e293b 50%, #0f172a);border:2px solid #475569;border-radius:14px;box-shadow:inset 0 10px 20px rgba(0,0,0,0.8), inset 0 -10px 20px rgba(0,0,0,0.8);position:relative;overflow:hidden}
.rb::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom, rgba(255,255,255,0.1), transparent 20%, transparent 80%, rgba(255,255,255,0.05));pointer-events:none}
.pitch{position:relative;height:420px;background:repeating-linear-gradient(#15803d 0 40px,#166534 40px 80px);border:4px solid #064e3b;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5)}
.pitch:before{content:"";position:absolute;left:0;right:0;top:46%;border-top:2px solid rgba(255,255,255,0.3)}
.pitch:after{content:"";position:absolute;left:50%;top:46%;width:110px;height:110px;margin:-55px;border:2px solid rgba(255,255,255,0.3);border-radius:50%}
*{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}html,body{overscroll-behavior:none;touch-action:manipulation}
#a>div{animation:fi .3s cubic-bezier(.2,.8,.2,1)}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tk{from{transform:translateY(-20px);opacity:.1}to{transform:none;opacity:1}}
.card-shadow{box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3)}
.glass-panel{background:rgba(15, 23, 42, 0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}
.bbtn{background:linear-gradient(180deg,#1e40af,#172554);color:#fff;font-style:italic;font-weight:800;border:1px solid #3b82f6;border-radius:14px;box-shadow:0 4px 0 #0b1437,0 6px 15px rgba(30,64,175,.5);transition:all .1s}
.bbtn:active{box-shadow:0 0 0 #0b1437;margin-top:4px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.bob{animation:bob 2.6s ease-in-out infinite}

/* ===== premium home ===== */
.hx-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 50% -5%,#24479e 0%,#0b1538 42%,#03050f 100%)}
.hx-beam{position:absolute;top:-8%;width:150px;height:78vh;transform-origin:50% 0;transform:rotate(var(--r));background:linear-gradient(to bottom,var(--c),transparent 85%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(5px);animation:hxsway 7s ease-in-out infinite alternate}
.hx-beam:nth-child(2){animation-delay:-2s}.hx-beam:nth-child(3){animation-delay:-4s}
@keyframes hxsway{from{opacity:.55;transform:rotate(var(--r))}to{opacity:1;transform:rotate(calc(var(--r) + 5deg))}}
.hx-pitch{position:absolute;left:-30%;right:-30%;bottom:-6%;height:58%;transform:perspective(520px) rotateX(64deg);transform-origin:50% 100%;background:repeating-linear-gradient(90deg,#14532d 0 40px,#1a6b38 40px 80px);opacity:.55;-webkit-mask-image:linear-gradient(to top,#000 15%,transparent 92%);mask-image:linear-gradient(to top,#000 15%,transparent 92%)}
.hx-pitch:before{content:"";position:absolute;left:50%;top:18%;width:200px;height:200px;margin-left:-100px;border:3px solid rgba(255,255,255,.55);border-radius:50%}
.hx-pitch:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:3px solid rgba(255,255,255,.45)}
.hx-vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.65) 100%)}
.hx-pt{position:absolute;bottom:-10px;border-radius:50%;background:#ffe27a;box-shadow:0 0 8px #facc15;opacity:0;animation:hxup linear infinite}
@keyframes hxup{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-75vh);opacity:0}}
.hx-wrap{position:relative;z-index:1;padding:12px 14px 170px}
.hx-top{display:flex;align-items:center;gap:10px}
.hx-av{position:relative;width:54px;height:54px;border-radius:50%;padding:3px;box-shadow:0 0 16px rgba(249,115,22,.55)}
.hx-avin{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1e3a8a,#050b1f);display:flex;align-items:center;justify-content:center;border:2px solid #050b1f}
.hx-lv b{font-size:22px;font-weight:800;font-style:italic;line-height:1;display:block;text-shadow:0 2px 0 #000}
.hx-xp{display:flex;gap:3px;margin-top:5px}
.hx-xp i{display:block;width:26px;height:8px;transform:skewX(-22deg);background:#1e293b;border:1px solid #475569}
.hx-xp i.on{background:linear-gradient(180deg,#fde047,#f97316);border-color:#fde68a;box-shadow:0 0 8px rgba(250,204,21,.8)}
.hx-chip{display:flex;align-items:center;gap:7px;padding:7px 14px 7px 10px;border-radius:12px;border:1px solid rgba(250,204,21,.4);background:linear-gradient(180deg,rgba(30,41,59,.85),rgba(2,6,23,.9));color:#facc15;box-shadow:0 0 12px rgba(250,204,21,.15)}
.hx-chip b{font-size:24px;font-weight:800;line-height:1;color:#fff}.hx-chip small{font-size:11px;letter-spacing:.18em;font-weight:800;color:#94a3b8}
.hx-logo{text-align:center;margin-top:14px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(250,204,21,.35))}
.hx-tag{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.38em;color:#93c5fd;filter:none}
.hx-tag i{display:block;width:34px;height:2px;background:linear-gradient(90deg,transparent,#60a5fa)}.hx-tag i:last-child{transform:scaleX(-1)}
.hx-t{font-size:60px;font-weight:800;font-style:italic;line-height:.95;letter-spacing:-.02em;margin-top:2px}
.hx-t span{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.hx-t .s{background-image:linear-gradient(180deg,#fff 25%,#9fb6e6)}
.hx-t .g{margin-left:10px;background-image:linear-gradient(110deg,#c98a0c 0%,#ffe27a 38%,#fff 50%,#ffe27a 62%,#c98a0c 100%);background-size:260% 100%;animation:hxs 3.6s linear infinite}
@keyframes hxs{from{background-position:130% 0}to{background-position:-130% 0}}
.hx-hero{position:relative;display:flex;justify-content:center;align-items:center;margin-top:16px;height:222px}
.hx-card{position:relative;width:146px;height:194px;flex:none;filter:drop-shadow(0 12px 16px rgba(0,0,0,.65)) drop-shadow(0 0 14px var(--c2))}
.hx-a{margin-right:-8px;transform:rotate(-6deg);animation:hxf1 4.5s ease-in-out infinite}
.hx-b{margin-left:-8px;transform:rotate(6deg);animation:hxf2 4.5s ease-in-out infinite}
@keyframes hxf1{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-7px)}}
@keyframes hxf2{0%,100%{transform:rotate(6deg) translateY(-7px)}50%{transform:rotate(6deg) translateY(0)}}
.hx-cin{position:absolute;inset:0;overflow:hidden;color:var(--tx);clip-path:polygon(50% 0,100% 7%,100% 84%,50% 100%,0 84%,0 7%);background:linear-gradient(155deg,var(--c1),var(--c2) 46%,var(--c3))}
.hx-cin:before{content:"";position:absolute;inset:3px;clip-path:polygon(50% 0,100% 7%,100% 84%,50% 100%,0 84%,0 7%);background:repeating-linear-gradient(60deg,rgba(255,255,255,.13) 0 6px,transparent 6px 15px),radial-gradient(circle at 50% 28%,rgba(255,255,255,.4),transparent 62%);border:0}
.hx-cin:after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:hxsh 4.2s ease-in-out infinite}
@keyframes hxsh{0%,55%{left:-70%}100%{left:130%}}
.hx-rt{position:absolute;top:24px;left:20px;line-height:.9;z-index:2}
.hx-rt b{display:block;font-size:34px;font-weight:800;font-style:italic}.hx-rt small{font-size:10px;font-weight:800;letter-spacing:.2em}
.hx-sil{position:absolute;left:50%;top:32px;width:90px;margin-left:-36px;fill:rgba(0,0,0,.26);z-index:1}
.hx-inp{position:absolute;z-index:3;left:16px;right:16px;bottom:32px;width:auto;padding:3px 4px;border:0;border-bottom:2px solid rgba(0,0,0,.5);border-radius:6px;background:rgba(0,0,0,.16);text-align:center;font:800 italic 20px 'Barlow Condensed',Arial,sans-serif;color:var(--tx);outline:none;text-transform:uppercase}
.hx-inp::placeholder{color:rgba(0,0,0,.38)}.hx-inp:focus{background:rgba(255,255,255,.35)}
.hx-fm{position:absolute;z-index:2;left:0;right:0;bottom:13px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.15em;opacity:.75}
.hx-vs{position:absolute;z-index:6;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;font-style:italic;color:#fff;border:2px solid #ffd27a;background:radial-gradient(circle at 35% 30%,#ff9a62,#e2231a 60%,#7a0f0f);box-shadow:0 0 18px rgba(255,80,40,.8),0 4px 8px rgba(0,0,0,.6);text-shadow:0 2px 0 rgba(0,0,0,.5);animation:hxv 1.8s ease-in-out infinite}
@keyframes hxv{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.hx-modes{display:flex;gap:8px;margin-top:18px}
.hx-tile{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:14px;border:1.5px solid rgba(148,163,184,.25);background:linear-gradient(180deg,rgba(30,41,59,.75),rgba(8,14,32,.85));color:#94a3b8;backdrop-filter:blur(6px);transition:all .15s}
.hx-tile b{font-size:14px;font-weight:800;font-style:italic;letter-spacing:.04em;line-height:1}.hx-tile small{font-size:12px;font-weight:700;opacity:.8;line-height:1}
.hx-tile.on{border-color:#facc15;color:#facc15;transform:translateY(-3px);background:linear-gradient(180deg,rgba(250,204,21,.24),rgba(120,80,0,.3));box-shadow:0 0 18px rgba(250,204,21,.4),inset 0 0 12px rgba(250,204,21,.15)}
.hx-tile:active{transform:scale(.95)}
.hx-desc{text-align:center;margin-top:10px;font-size:14px;font-weight:700;letter-spacing:.12em;color:#94a3b8}
.hx-dock{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:500px;margin:0 auto;padding:34px 12px calc(env(safe-area-inset-bottom,0px) + 14px);background:linear-gradient(to top,rgba(2,6,23,.96) 55%,transparent)}
.hx-row{display:flex;align-items:flex-end;gap:10px}
.hx-sd{flex:.8;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(59,130,246,.4))}
.hx-pw{flex:1.7;animation:hxp 2.2s ease-in-out infinite}
@keyframes hxp{0%,100%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 8px rgba(250,204,21,.4))}50%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(250,204,21,.9))}}
.hx-side,.hx-play{display:block;width:100%;border:0;padding:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.hx-side{background:linear-gradient(180deg,#bfdbfe,#2563eb)}.hx-play{background:linear-gradient(180deg,#fffbd0,#f5b800)}
.hx-side span,.hx-play span{position:relative;overflow:hidden;display:flex;margin:2px;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);align-items:center;justify-content:center;transition:transform .08s}
.hx-side span{flex-direction:column;gap:2px;height:60px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),transparent 50%),linear-gradient(180deg,#1d4ed8,#0f1f58)}
.hx-side b{font-size:15px;font-weight:800;font-style:italic;letter-spacing:.05em;line-height:1}
.hx-play span{height:74px;color:#111;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 48%),linear-gradient(180deg,#ffe45c,#f5a300)}
.hx-play b{font-size:46px;font-weight:800;font-style:italic;letter-spacing:.06em;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.hx-play span:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:hxsh 3s ease-in-out infinite}
.hx-side:active span,.hx-play:active span{transform:translateY(3px);filter:brightness(.92)}

#a{position:relative;z-index:1}
html{-webkit-text-size-adjust:100%}body{-webkit-touch-callout:none}
button:not(.gbtn):not(.hx-side):not(.hx-play):not(.rsb):not(.abt):active{transform:scale(.97)}
.gbtn{position:relative;overflow:hidden}
.gbtn:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:hxsh 3s ease-in-out infinite;pointer-events:none}
.hx-snd{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(148,163,184,.4);background:rgba(15,23,42,.8);color:#cbd5e1}
.hx-side em{font-style:normal;font-size:10px;letter-spacing:.12em;color:#93c5fd;font-weight:700;line-height:1}
.hx-nm{position:absolute;z-index:3;left:12px;right:12px;bottom:30px;text-align:center;font:800 italic 21px/1 'Barlow Condensed',Arial,sans-serif;color:var(--tx);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-fg{position:absolute;top:26px;right:22px;z-index:2;font-size:22px;line-height:1}
.rsw{filter:drop-shadow(0 5px 8px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(168,85,247,.45))}
.rsb{display:block;border:0;padding:0;background:linear-gradient(180deg,#e9d5ff,#7c3aed);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.rsb span{display:flex;align-items:center;gap:8px;height:46px;padding:0 26px;margin:2px;color:#fff;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 50%),linear-gradient(180deg,#6d28d9,#2e1065);transition:transform .08s}
.rsb b{font-size:20px;font-weight:800;font-style:italic;letter-spacing:.08em}
.rsb i{font-style:normal;font-weight:800;font-size:15px;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#facc15;color:#000;box-shadow:0 0 8px rgba(250,204,21,.7)}
.rsb:active span{transform:translateY(2px)}
.rsb:disabled{filter:grayscale(1) brightness(.7);opacity:.6}.rsb:disabled i{background:#64748b;box-shadow:none;color:#cbd5e1}
.abt{border:1.5px solid #60a5fa;background:linear-gradient(180deg,#2563eb,#0f1f58);color:#fff;border-radius:12px;font-weight:800;font-style:italic;box-shadow:0 4px 0 #0b1437;transition:all .08s}
.abt:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1437}.abt:disabled{opacity:.3;filter:grayscale(.6)}
.abt.red{border-color:#fca5a5;background:linear-gradient(180deg,#ef4444,#7f1d1d);box-shadow:0 4px 0 #450a0a}
.soldstamp{display:inline-block;font-size:84px;line-height:1;font-weight:800;font-style:italic;border:6px solid currentColor;padding:4px 22px;border-radius:10px;letter-spacing:.04em;text-shadow:0 0 20px currentColor;transform:rotate(-8deg);animation:stamp .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

/* ===== auction pro UI ===== */
.bbw{filter:drop-shadow(0 5px 6px rgba(0,0,0,.55)) drop-shadow(0 0 7px var(--k))}
.bbw.off{filter:grayscale(1);opacity:.35}
.bb{display:block;width:100%;border:0;padding:0;background:var(--k);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.bb span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:64px;margin:2px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 55%),linear-gradient(180deg,#16286a,#0a1233);transition:transform .08s}
.bb b{font-size:22px;font-weight:800;font-style:italic;line-height:1;color:#fff}
.bb em{font-style:normal;font-size:15px;font-weight:800;line-height:1;color:var(--k)}
.bb:active span{transform:translateY(2px);filter:brightness(1.25)}
.pbw{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.pbt{display:block;width:100%;border:0;padding:0;background:linear-gradient(180deg,#fca5a5,#b91c1c);clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.pbt span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;margin:2px;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 50%),linear-gradient(180deg,#5b1212,#2a0808)}
.pbt b{font-size:26px;font-weight:800;font-style:italic;letter-spacing:.12em;line-height:1;color:#fecaca}
.pbt em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.06em;line-height:1;color:#fca5a5;opacity:.85}
.pbt:active span{transform:translateY(2px)}
.hchip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid;border-radius:8px;padding:1px 8px;font-size:15px;font-weight:800;line-height:22px;background:rgba(2,6,23,.6);white-space:nowrap}
.hchip b{color:#fff}
.tierchip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.2em;padding:1px 9px;border-radius:6px;border:1.5px solid;margin-bottom:4px}
.hx-face{position:absolute;z-index:1;left:50%;top:30px;width:96px;height:106px;margin-left:-48px;object-fit:cover;object-position:50% 14%;border-radius:48px 48px 0 0;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(#000 60%,transparent 100%);mask-image:linear-gradient(#000 60%,transparent 100%);filter:contrast(1.05) saturate(1.05)}
.hx-card.icn{filter:drop-shadow(0 12px 16px rgba(0,0,0,.65)) drop-shadow(0 0 22px #a855f7)}
.hx-cam{position:absolute;z-index:4;left:20px;top:86px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.hx-av2{width:108px;top:24px;margin-left:-54px;fill:none;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.hx-nm2{position:absolute;z-index:3;left:12px;right:12px;bottom:72px;text-align:center;font:800 italic 23px/1 'Barlow Condensed',Arial,sans-serif;text-transform:uppercase;color:var(--tx);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lcs{position:absolute;z-index:3;left:14px;right:14px;bottom:34px;display:flex;justify-content:space-between;border-top:1.5px solid rgba(0,0,0,.25);padding-top:5px;color:var(--tx)}
.lcs span{text-align:center;line-height:1}.lcs small{display:block;font-size:9px;font-weight:800;letter-spacing:.06em;opacity:.7}.lcs b{font-size:17px;font-weight:800}
.bbw{filter:drop-shadow(0 4px 5px rgba(0,0,0,.5))}

/* ===== CALMER MOTION ===== */
:root{--ease:cubic-bezier(.22,.68,.2,1)}
